<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b3d17">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>RAY Scanner · Puente</title>
<style>
:root{--g:#0b3d17;--g2:#14632a;--g3:#1d7a35;--y:#f5c400;--bg:#f3f6f4;--sf:#fff;--ln:#dfe7e2;--ink:#14231a;--mut:#617166;--ok:#15803d;--bad:#c0392b;--sh:0 10px 30px -18px rgba(0,40,10,.45)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1511;--sf:#16201a;--ln:#26342b;--ink:#e6efe9;--mut:#93a59a;--sh:0 10px 30px -18px #000}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit}
.scr{position:fixed;inset:0;display:none;flex-direction:column}.scr.on{display:flex}
/* ---------- inicio ---------- */
#home{overflow:auto;display:none}#home.on{display:block}
.hd{background:linear-gradient(150deg,#0b3d17,#14632a 70%,#1d7a35);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 22px;border-radius:0 0 26px 26px;box-shadow:var(--sh)}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:13px;background:#0a2e12;display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.logo b{font:900 13px/1 Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:2px}.logo i{font-style:normal;background:var(--y);color:#0b3d17;border-radius:6px;padding:1px 4px;font-size:8px}
.brand h1{margin:0;font-size:20px;font-weight:900}.brand p{margin:1px 0 0;font-size:12.5px;opacity:.85}
.st{margin-top:14px;display:flex;align-items:center;gap:8px;font-size:13px;background:rgba(255,255,255,.12);border-radius:12px;padding:8px 11px}
.dot{width:9px;height:9px;border-radius:50%;background:#cbd5e1;flex:none}.dot.ok{background:#4ade80;box-shadow:0 0 0 4px rgba(74,222,128,.25)}.dot.bad{background:#f87171}
.wrap{padding:16px;display:flex;flex-direction:column;gap:14px;max-width:620px;margin:0 auto;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:15px;box-shadow:var(--sh)}
.card h2{margin:0 0 10px;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:8px}.card h2 em{font-style:normal;font-size:12px;color:var(--mut);font-weight:700}
.big{width:100%;display:flex;align-items:center;gap:14px;padding:18px;border:0;border-radius:20px;background:linear-gradient(150deg,#14632a,#0b3d17);color:#fff;text-align:left;box-shadow:0 14px 30px -16px #0b3d17;cursor:pointer}
.big span{width:58px;height:58px;border-radius:17px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.big b{display:block;font-size:18px}.big small{opacity:.85;font-size:12.5px}
.sec{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sec label,.sec button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:84px;border-radius:16px;border:1.5px solid var(--ln);background:var(--sf);font-weight:800;font-size:13.5px;text-align:center;padding:10px;cursor:pointer}
.sec small{font-weight:600;color:var(--mut);font-size:11.5px}.sec input{display:none}
.draft{display:flex;align-items:center;gap:12px}.draft img{width:46px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);background:#fff}
.draft div{flex:1;min-width:0}.draft b{display:block}.draft small{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:0 16px;border-radius:13px;border:1.5px solid var(--ln);background:var(--sf);font-weight:800;font-size:14px;cursor:pointer}
.btn.pri{background:linear-gradient(150deg,#14632a,#0b3d17);border-color:#0b3d17;color:#fff}.btn.wide{width:100%;min-height:52px;font-size:16px;border-radius:16px}.btn:disabled{opacity:.5}
.sent{list-style:none;margin:0;padding:0}.sent li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--ln)}.sent li:last-child{border-bottom:0}
.sent i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;background:#fef3c7}.sent li.ok i{background:#dcfce7}.sent li.err i{background:#fee2e2}
.sent div{flex:1;min-width:0}.sent b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sent small{font-size:12px;color:var(--mut)}
.empty{color:var(--mut);font-size:13px;text-align:center;padding:8px}
.link{background:none;border:0;color:var(--mut);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:6px}
.hero{text-align:center;padding:30px 18px}.hero span{font-size:52px}.hero h2{margin:10px 0 6px;font-size:20px;display:block}.hero p{color:var(--mut);margin:0}
/* ---------- cámara ---------- */
#cam{background:#000;color:#fff}
#cam .vw{position:relative;flex:1;overflow:hidden}
#cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.ctop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.55),transparent);z-index:2}
.cb{width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.cb.on{background:var(--y);color:#0b3d17}
.chint{flex:1;text-align:center;font-size:13px;font-weight:700;text-shadow:0 1px 3px #000}
.chint span{display:inline-block;padding:5px 12px;border-radius:99px;background:rgba(0,0,0,.45)}
.cbot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px calc(18px + env(safe-area-inset-bottom));background:#000}
.shot{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:rgba(255,255,255,.2);cursor:pointer;position:relative;flex:none}
.shot::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff;transition:transform .1s}.shot:active::after{transform:scale(.88)}
.shot.auto{border-color:var(--y)}
.stack{width:58px;height:58px;border-radius:12px;border:2px solid #fff;background:#222 center/cover;position:relative;cursor:pointer;flex:none}
.stack em{position:absolute;top:-8px;right:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--y);color:#0b3d17;font:900 12px/22px Arial;text-align:center;font-style:normal;padding:0 5px}
.stack.none{opacity:.3}
.cb.hd{display:flex;align-items:center;justify-content:center;padding:0;font:900 13px/1 Arial;letter-spacing:.02em;background:rgba(245,196,0,.22);color:#f5c400;position:relative}
.pgblur{position:absolute;left:8px;top:8px;background:#f59e0b;color:#3b2a00;font:800 11.5px/1 Arial;padding:6px 9px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.gal{width:58px;height:58px;border-radius:12px;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;cursor:pointer;font-size:24px;flex:none}.gal input{display:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}.flash.on{opacity:.8;transition:none}
.camerr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.camerr label{cursor:pointer}.camerr input{display:none}
/* ---------- edición ---------- */
#ed{background:#11161a;color:#fff}
.etop{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:#0b0f12}
.etop b{flex:1;text-align:center;font-size:15px}
.tb{min-width:42px;height:42px;padding:0 12px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.tb.pri{background:#16a34a}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px}
.stage img{max-width:100%;max-height:100%;box-shadow:0 10px 30px rgba(0,0,0,.6);background:#fff;border-radius:3px}
.stage .busy{position:absolute;inset:0;display:grid;place-items:center}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:56px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;border-radius:12px;cursor:pointer}.nav.l{left:6px}.nav.r{right:6px}.nav:disabled{opacity:.15}
.pgn{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:800;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:99px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:#0b0f12;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.strip button{position:relative;width:52px;height:68px;flex:none;border-radius:8px;border:2px solid transparent;background:#222 center/cover;cursor:pointer;padding:0}
.strip button.on{border-color:var(--y)}.strip button em{position:absolute;left:3px;bottom:3px;font:800 10px/1 Arial;background:rgba(0,0,0,.6);padding:2px 4px;border-radius:4px;font-style:normal}
.strip .add{display:grid;place-items:center;border:2px dashed rgba(255,255,255,.35);background:none;font-size:24px;color:#fff}
.flt{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;background:#0b0f12;scrollbar-width:none}.flt::-webkit-scrollbar{display:none}
.flt button{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:#cbd5e1;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.flt span{width:60px;height:76px;border-radius:9px;border:2px solid transparent;background:#333 center/cover;display:block}
.flt button.on{color:var(--y)}.flt button.on span{border-color:var(--y)}
.adj{padding:4px 16px 8px;background:#0b0f12;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:#cbd5e1}.adj input{width:100%;accent-color:#f5c400}
.ebot{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(10px + env(safe-area-inset-bottom));background:#0b0f12}
.ebot button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:#e5e7eb;font-size:11px;font-weight:700;padding:6px 0;border-radius:10px;cursor:pointer}
.ebot button.on{color:var(--y);background:rgba(245,196,0,.1)}.ebot button.bad{color:#fca5a5}
/* ---------- limpieza ---------- */
.fxp{background:#0b0f12;padding:8px 14px 6px;display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow:auto}
.fxr{display:flex;gap:7px}
.fxa{flex:1;height:40px;border:0;border-radius:12px;background:linear-gradient(135deg,#f5c400,#f59e0b);color:#3b2a00;font:inherit;font-weight:900;font-size:13.5px;cursor:pointer;box-shadow:0 6px 16px -8px #f5c400}
.fxa:active{transform:scale(.97)}
.fxb{height:40px;padding:0 12px;border:0;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:800;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.fxb.on{background:rgba(239,68,68,.22);color:#fecaca}
.fxs{display:grid;grid-template-columns:1fr 92px 38px;align-items:center;gap:8px;font-size:12.5px;color:#e5e7eb;font-weight:700}
.fxs span{display:flex;flex-direction:column;line-height:1.15}.fxs small{font-size:10.5px;color:#94a3b8;font-weight:600}
.fxs input{width:100%;accent-color:#f5c400}.fxs output{font-size:11.5px;color:#f5c400;text-align:right;font-weight:800}
.fxt{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.fxt button{height:38px;border-radius:11px;border:1.5px solid rgba(255,255,255,.14);background:none;color:#cbd5e1;font:inherit;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.fxt button b{font-size:14px}.fxt button.on{border-color:#f5c400;background:rgba(245,196,0,.14);color:#f5c400}
.fxall{height:34px;border:0;border-radius:10px;background:rgba(255,255,255,.07);color:#cbd5e1;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.ebot button.has::after{content:'';position:absolute;top:4px;right:calc(50% - 16px);width:7px;height:7px;border-radius:50%;background:#f5c400}
.ebot button{position:relative}
.cmp{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);height:34px;padding:0 14px;border:0;border-radius:99px;background:rgba(0,0,0,.62);color:#fff;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;white-space:nowrap;backdrop-filter:blur(6px)}
.cmp.on{background:#f5c400;color:#3b2a00}
.ebot{grid-template-columns:repeat(6,1fr)!important}
/* ---------- borrador ---------- */
#er{background:#0b0f12;color:#fff}
.erst{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:14px}
.erst img{max-width:100%;max-height:100%;background:#fff;border-radius:3px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.erst canvas{position:absolute;touch-action:none;cursor:crosshair}
.erst .busy{position:absolute;inset:0;display:grid;place-items:center}
.erbar{padding:8px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:#0b0f12}
.erseg{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;border-radius:13px;background:rgba(255,255,255,.07)}
.erseg button{border:0;border-radius:10px;background:none;color:#cbd5e1;font:inherit;font-weight:800;font-size:13px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;cursor:pointer}
.erseg small{font-size:10.5px;font-weight:600;opacity:.75}.erseg button.on{background:#fff;color:#0b3d17}
.err{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;font-size:12.5px;font-weight:700;color:#e5e7eb}.err input{accent-color:#f5c400}
.erb{display:flex;gap:8px}.erb .tb{flex:1}
.erh{margin:0;font-size:11.5px;color:#94a3b8;text-align:center}
/* ---------- recorte ---------- */
#crop{background:#0b0f12;color:#fff}
.cst{flex:1;position:relative;overflow:hidden;touch-action:none}
.cst canvas{position:absolute}
#cpoly{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.loupe{position:absolute;width:110px;height:110px;border-radius:50%;border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.6);overflow:hidden;pointer-events:none;display:none;background:#000}
.loupe canvas{position:static}
.cbar{display:flex;gap:8px;justify-content:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom));background:#0b0f12}
/* ---------- enviar ---------- */
#snd{overflow:auto;display:none}#snd.on{display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.grid img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--ln)}
.grid figure{margin:0;position:relative}.grid figcaption{position:absolute;left:4px;bottom:4px;font:800 11px/1 Arial;background:rgba(0,0,0,.6);color:#fff;padding:2px 5px;border-radius:5px}
.f{display:flex;flex-direction:column;gap:5px;margin-top:12px}.f span{font-size:12px;font-weight:700;color:var(--mut)}
.f input{height:46px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);padding:0 12px;font:inherit;outline:none}.f input:focus{border-color:var(--g2)}
.prog{height:8px;border-radius:99px;background:var(--ln);overflow:hidden;margin-top:12px}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#16a34a,#f5c400);transition:width .2s}
.msg{font-size:13px;margin:8px 0 0;color:var(--mut)}.msg.bad{color:var(--bad);font-weight:700}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sp{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .8s linear infinite}.sp.dk{border-color:rgba(0,0,0,.12);border-top-color:#14632a}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14231a;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;max-width:92vw;box-shadow:0 10px 30px -10px #000;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;text-align:center}.toast.on{opacity:1}
</style>
</head>
<body>
<section class="scr" id="home"></section>
<section class="scr" id="cam">
 <div class="vw"><video id="vid" playsinline muted autoplay></video><canvas id="ov"></canvas><div class="flash" id="fl"></div>
  <div class="ctop"><button class="cb" data-a="cam-close" aria-label="Cerrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="chint"><span id="hint">Apunta a la hoja</span></div><button class="cb" data-a="torch" id="torch" hidden aria-label="Flash">⚡</button><button class="cb" data-a="auto" id="autoB" aria-label="Disparo automático">A</button><label class="cb hd" aria-label="Cámara del celular · máxima calidad" title="Cámara del celular · máxima calidad">HD<input type="file" accept="image/*" capture="environment" id="hdIn" hidden></label></div>
  <div class="camerr" id="camErr" hidden></div></div>
 <div class="cbot"><label class="gal" aria-label="Importar de la galería">🖼️<input type="file" accept="image/*,application/pdf,.pdf" multiple id="galIn"></label><button class="shot" data-a="shot" id="shot" aria-label="Tomar foto"></button><button class="stack none" data-a="done" id="stack" aria-label="Revisar páginas"><em id="cnt">0</em></button></div>
</section>
<section class="scr" id="ed"></section>
<section class="scr" id="crop">
 <div class="etop"><button class="tb" data-a="crop-x">Cancelar</button><b>Ajusta las esquinas</b><button class="tb pri" data-a="crop-ok">Aplicar</button></div>
 <div class="cst" id="cst"><canvas id="ccv"></canvas><svg id="cpoly"></svg><div class="loupe" id="loupe"><canvas id="lcv" width="110" height="110"></canvas></div></div>
 <div class="cbar"><button class="tb" data-a="crop-auto">✨ Detectar</button><button class="tb" data-a="crop-all">⬜ Toda la foto</button></div>
</section>
<section class="scr" id="er"></section>
<section class="scr" id="snd"></section>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="fbCam" hidden>
<script type="text/plain" id="coreSrc">function RAYSCAN_CORE(){
'use strict';
function clamp(v){return v<0?0:v>255?255:v}

/* ---------- utilidades de mapas de un canal ---------- */
function boxBlur(src,w,h,r){var tmp=new Float32Array(w*h),out=new Float32Array(w*h),x,y,acc,inv=1/(2*r+1),row;
 for(y=0;y<h;y++){row=y*w;acc=0;for(x=-r;x<=r;x++)acc+=src[row+(x<0?0:x>=w?w-1:x)];
  for(x=0;x<w;x++){tmp[row+x]=acc*inv;var xi=x+r+1,xo=x-r;acc+=src[row+(xi>=w?w-1:xi)]-src[row+(xo<0?0:xo)]}}
 var col=new Float32Array(w);for(y=-r;y<=r;y++){row=(y<0?0:y>=h?h-1:y)*w;for(x=0;x<w;x++)col[x]+=tmp[row+x]}
 for(y=0;y<h;y++){row=y*w;var ri=(y+r+1>=h?h-1:y+r+1)*w,ro=(y-r<0?0:y-r)*w;
  for(x=0;x<w;x++){out[row+x]=col[x]*inv;col[x]+=tmp[ri+x]-tmp[ro+x]}}
 return out}
function otsu(m){var hist=new Float64Array(256),n=m.length,i;for(i=0;i<n;i++)hist[m[i]|0]++;
 var sum=0;for(i=0;i<256;i++)sum+=i*hist[i];var sB=0,wB=0,best=0,th=128;
 for(i=0;i<256;i++){wB+=hist[i];if(!wB)continue;var wF=n-wB;if(!wF)break;sB+=i*hist[i];var mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}
 return th}
function erode(b,w,h,r){var o=new Uint8Array(w*h),x,y,k;var t=new Uint8Array(w*h);
